name: Quarto Publish

on:
  push:
    branches: main   # or "master" if that's your default branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Check out your repo
      - name: Check out repository
        uses: actions/checkout@v4

      # Install Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # (Optional) Install LaTeX if you need PDF rendering
      # - name: Install TinyTeX
      #   uses: quarto-dev/quarto-actions/setup-tinytex@v2

      # Render the site
      - name: Render Quarto Project
        run: quarto render

      # Publish the rendered site (from _site/) to gh-pages
      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
